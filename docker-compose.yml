services:

  postgres:
    image: postgres:16
    container_name: aerovision-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: aerovision
      POSTGRES_USER: aerovision
      POSTGRES_PASSWORD: aerovision_dev_password
    ports:
      - "5432:5432"
    volumes:
      - aerovision_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aerovision -d aerovision"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: aerovision-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - aerovision_redis_data:/data

volumes:
  aerovision_postgres_data:
  aerovision_redis_data: